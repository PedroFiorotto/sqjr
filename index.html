header{background:var(--b);padding:28px 20px 56px;text-align:center}

.search{display:flex;margin-top:-28px;background:#fff;border:3px solid var(--y)}

.chips{display:flex;gap:8px;overflow-x:auto;padding:18px 0 8px}
.chip{flex:none;border:2px solid var(--b);background:transparent;color:var(--b);padding:6px 14px;font-weight:600;font-size:13px;cursor:pointer}
.chip.on{background:var(--b);color:var(--c)}
#count{font-size:14px;margin:8px 0 14px;font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;padding-bottom:40px}
.card{background:#fff;border-left:8px solid var(--y);padding:16px}
.card h2{font-size:17px;line-height:1.25}
.card .m{font-size:14px;margin-top:4px;opacity:.8}
.tags{display:flex;gap:6px;margin:10px 0;flex-wrap:wrap}
.tag{background:var(--b);color:var(--c);font-size:12px;font-weight:700;padding:3px 9px}
.tag.y{background:var(--y);color:var(--b)}
.row{font-size:13.5px;margin-top:4px}
.row b{font-weight:700}
.price{margin-top:12px;background:var(--c);padding:8px 10px;font-weight:800;font-size:15px}
.empty{text-align:center;padding:50px 0;font-weight:600}
footer{background:var(--b);color:var(--c);text-align:center;padding:18px;font-size:13px}
mark{background:var(--y);color:var(--b);padding:0 1px}
</style>

const tecs=[...T.map(t=>t[0]),"Outras técnicas"];
function chips(){$("chips").innerHTML=["Todas",...tecs].map(l=>`<button class="chip ${(l==="Todas"?"":l)===loc?"on":""}" data-l="${l==="Todas"?"":l}">${l}</button>`).join("")}
const esc=s=>s.replace(/[&<>]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;"}[c]));
function render(){
const t=norm($("q").value).split(/\s+/).filter(Boolean);
const r=D.filter(d=>(!loc||d.tec.includes(loc))&&t.every(x=>d.k.includes(x)));
$("count").textContent=r.length+(r.length===1?" equipamento encontrado":" equipamentos encontrados");
$("grid").innerHTML=r.length?r.map(d=>`<article class="card"><h2>${esc(d.nome)}</h2><div class="m">${esc(d.marca)} · ${esc(d.modelo)}</div><div class="tags"><span class="tag y">${esc(d.cls)}</span><span class="tag" style="background:var(--c);color:var(--b)">${esc(d.tec[0])}</span><span class="tag">${esc(d.local)}</span></div><div class="row"><b>Responsável:</b> ${esc(d.resp)}</div><div class="row"><b>Patrimônio:</b> ${esc(d.pat)}</div><div class="price">${esc(d.valor)}</div></article>`).join(""):'<div class="empty" style="grid-column:1/-1">Nenhum equipamento encontrado. Tente outro termo.</div>';
}
$("q").addEventListener("input",render);
$("clr").onclick=()=>{$("q").value="";loc="";chips();render();$("q").focus()};
$("chips").onclick=e=>{if(e.target.dataset.l!==undefined){loc=e.target.dataset.l;chips();render()}};
chips();render();
</script>
</body>
</html>
