<style>
:root{--y:#F7B733;--c:#FDF6EC;--b:#04124F}
*{box-sizing:border-box;margin:0}
body{font-family:"Montserrat","Segoe UI",Helvetica,Arial,sans-serif;background:var(--c);color:var(--b)}
header{background:var(--b);padding:28px 20px 56px;text-align:center}
header img{height:150px;max-width:90%;object-fit:contain}
.wm{display:none;color:var(--c);font-weight:800;font-size:22px}
button,input{font-family:inherit}
header h1{color:var(--c);font-size:26px;font-weight:800;margin-top:14px;letter-spacing:.5px}
header h1 span{color:var(--y)}
.wrap{max-width:1100px;margin:0 auto;padding:0 16px}
.search{display:flex;margin-top:-28px;background:#fff;border:3px solid var(--y)}
.search input{flex:1;border:0;padding:16px;font-size:17px;color:var(--b);background:transparent;outline:0;min-width:0}
.search button{border:0;background:var(--y);color:var(--b);font-weight:700;padding:0 20px;font-size:15px;cursor:pointer}
.chips{display:flex;gap:8px;overflow-x:auto;padding:18px 0 8px}
.chip{flex:none;border:2px solid var(--b);background:#fff;color:var(--b);padding:6px 14px;font-weight:600;font-size:13px;cursor:pointer}
.chip.on{background:var(--b);color:var(--c)}
#count{font-size:14px;margin:8px 0 14px;font-weight:600}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;padding-bottom:40px}
.card{background:#fff;border-left:8px solid var(--y);padding:16px}
.card h2{font-size:17px;line-height:1.25}
.card .m{font-size:14px;margin-top:4px;opacity:.8}
.tags{display:flex;gap:6px;margin:10px 0;flex-wrap:wrap}
.tag{background:var(--b);color:var(--c);font-size:12px;font-weight:700;padding:3px 9px}
.tag.y{background:var(--y);color:var(--b)}
.row{font-size:13.5px;margin-top:4px}
.row b{font-weight:700}
.price{margin-top:12px;background:var(--c);padding:8px 10px;font-weight:800;font-size:15px}
.empty{text-align:center;padding:50px 0;font-weight:600}
footer{background:var(--b);color:var(--c);text-align:center;padding:18px;font-size:13px}
mark{background:var(--y);color:var(--b);padding:0 1px}
.tabs{display:inline-flex;margin-top:20px;border:2px solid var(--y)}
.tab{border:0;background:transparent;color:var(--c);font-weight:700;font-size:15px;padding:10px 22px;cursor:pointer}
.tab.on{background:var(--y);color:var(--b)}
.card.re{padding:14px 16px}
.card.re h2{font-size:16px}
.spec{display:inline-block;margin:10px 0 2px;border:2px solid var(--b);background:#fff;padding:4px 12px;font-weight:800;font-size:14px}
.rl{padding-bottom:40px}
.rw{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:8px 14px;background:#fff;border-left:8px solid var(--y);padding:10px 14px;margin-bottom:6px}
.rn{flex:1 1 220px;min-width:0}
.rn b{display:block;font-size:15.5px;line-height:1.25}
.rn small{font-size:12px;opacity:.7}
.rv{display:flex;flex-wrap:wrap;gap:6px;justify-content:flex-end}
.rw .spec{margin:0;padding:3px 10px;font-size:13px}
.spec i{font-style:normal;opacity:.65;font-weight:700}
.fm{font-weight:600;font-size:14px;opacity:.7;margin-left:10px;white-space:nowrap}
.qt{font-size:12px;font-weight:700;margin-left:6px;opacity:.7}
[hidden]{display:none!important}
footer .aviso{max-width:700px;margin:12px auto 0;padding-top:12px;border-top:2px solid var(--y);font-size:12.5px;line-height:1.5;opacity:.9}
</style>
</head>
